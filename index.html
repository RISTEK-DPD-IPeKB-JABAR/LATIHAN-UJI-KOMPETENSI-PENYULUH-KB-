<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Latihan Soal Penyuluh KB — Try Out Ujikom</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--pri:#4f46e5;--pri-d:#4338ca;--teal:#0d9488;--ink:#0f172a;--muted:#64748b;--line:#e5e9f2;--ok:#16a34a;--bad:#dc2626;--shadow:0 14px 40px -18px rgba(15,23,42,.35)}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  background:radial-gradient(900px 520px at 0% -10%,#dbeafe 0%,transparent 60%),radial-gradient(820px 520px at 100% 0%,#ccfbf1 0%,transparent 55%),#f6f8fc;min-height:100vh}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25}
h2{font-size:20px}h3{font-size:17px}
p{margin:0 0 .5em;color:var(--muted);line-height:1.6;font-size:14.5px}
small,.small{font-size:12.5px}.tiny{font-size:11.5px}.muted{color:var(--muted)}
code{background:#eef2ff;color:var(--pri-d);padding:1px 6px;border-radius:6px;font-size:12.5px}
pre.code{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:12px;overflow:auto;font-size:11.5px;line-height:1.55;max-height:340px;margin:8px 0}
hr.sep{border:none;border-top:1px dashed var(--line);margin:22px 0}
.container{max-width:1080px;margin:0 auto;padding:22px 18px 70px}.narrow{max-width:840px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.brand{display:flex;gap:13px;align-items:center}
.brand .logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--teal));color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 20px -8px rgba(79,70,229,.8);flex:0 0 auto}
.brand.small .logo{width:38px;height:38px;border-radius:11px;font-size:13px}
.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
label{display:block;font-size:13px;font-weight:600;color:#334155;margin:12px 0 6px}
.input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;font-size:14.5px;font-family:inherit;color:var(--ink);background:#fff;outline:none;transition:.15s}
.input:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(79,70,229,.12)}
textarea.input{resize:vertical}
select.input{appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2364748b'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center;background-size:20px;padding-right:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:.15s}
.btn:hover{background:#f8fafc;transform:translateY(-1px)}.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--pri),#6366f1);color:#fff;border-color:transparent;box-shadow:0 10px 22px -12px rgba(79,70,229,.9)}
.btn.primary:hover{background:linear-gradient(135deg,var(--pri-d),#4f46e5)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#fecaca;background:#fef2f2}
.btn.danger:hover{background:#fee2e2}
.btn.tiny{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%;margin-top:18px}
.row{display:flex;align-items:center;gap:10px}.row.gap{gap:10px}.row.between{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:450px;background:#fff;border-radius:22px;padding:26px;border:1px solid var(--line);box-shadow:0 40px 70px -35px rgba(30,41,59,.5)}
.tabs{display:flex;gap:6px;background:#f1f5f9;padding:5px;border-radius:14px;margin:22px 0 6px}
.tabs.big{margin:0 0 18px}
.tab{flex:1;padding:10px;border:none;background:transparent;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;transition:.15s}
.tab.active{background:#fff;color:var(--pri);box-shadow:0 4px 12px -4px rgba(15,23,42,.2)}
.hint{font-size:12px;color:var(--muted);margin-top:18px;text-align:center;line-height:1.6}
.chips{display:flex;gap:9px;flex-wrap:wrap}
.chip{padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:#475569;cursor:pointer;font-family:inherit;transition:.15s}
.chip:hover{border-color:#c7d2fe}
.chip.on{background:linear-gradient(135deg,var(--pri),#6366f1);color:#fff;border-color:transparent;box-shadow:0 8px 18px -10px rgba(79,70,229,.9)}
.badge{display:inline-block;padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:700;letter-spacing:.2px}
.pill{display:inline-block;padding:6px 12px;border-radius:999px;background:#f1f5f9;font-size:12.5px;font-weight:600;color:#475569}
.pill.ok{background:#ecfdf5;color:#166534}.pill.bad{background:#fef2f2;color:#991b1b}
.hero{display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#eef2ff 0%,#f0fdfa 100%)}
.hero-stat{display:flex;gap:14px}
.hero-stat>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 16px;text-align:center;min-width:92px}
.hero-stat strong{display:block;font-size:20px;color:var(--pri)}
.hero-stat span{font-size:11.5px;color:var(--muted)}
.stats{display:flex;gap:14px;flex-wrap:wrap}
.stats>div{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px 20px;text-align:center;min-width:110px}
.stats strong{display:block;font-size:22px;color:var(--pri)}.stats span{font-size:12px;color:var(--muted)}
.picker{margin-top:16px;border:1px dashed var(--line);border-radius:14px;padding:14px;background:#fbfcff}
.picker-list{max-height:330px;overflow:auto;margin:8px 0}
.pick-item{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;cursor:pointer;font-weight:400;margin:0;transition:.12s}
.pick-item:hover{background:#eef2ff}
.pick-item input{margin-top:3px;accent-color:var(--pri);flex:0 0 auto}
.pick-text{font-size:13.3px;color:#334155;line-height:1.45}
.switch{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:#475569;margin:0;cursor:pointer}
.switch input{accent-color:var(--pri);width:16px;height:16px}
.qtext{font-size:16.5px;line-height:1.55;margin:14px 0 18px;color:#111827}
.qtext.small{font-size:14.5px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:14.5px;font-family:inherit;color:inherit;margin-bottom:10px;transition:.15s;line-height:1.5}
.opt:hover{border-color:#c7d2fe;background:#f8faff}
.opt.sel{border-color:var(--pri);background:#eef2ff;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.opt .ltr{flex:0 0 28px;height:28px;border-radius:9px;background:#eef2ff;color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:13px}
.opt.sel .ltr{background:var(--pri);color:#fff}
.opt.static{cursor:default}
.opt.static:hover{border-color:var(--line);background:#fff;transform:none}
.opt.correct{border-color:#86efac;background:#f0fdf4}
.opt.correct .ltr{background:var(--ok);color:#fff}
.opt.wrong{border-color:#fecaca;background:#fef2f2}
.opt.wrong .ltr{background:var(--bad);color:#fff}
.palette{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;border-top:1px dashed var(--line);padding-top:16px}
.pal{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:#475569;cursor:pointer;font-family:inherit;transition:.12s}
.pal:hover{border-color:#c7d2fe}
.pal.done{background:#dcfce7;border-color:#86efac;color:#166534}
.pal.cur{outline:2.5px solid var(--pri);outline-offset:1px}
.result-head{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.score-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:conic-gradient(var(--pri) calc(var(--p)*1%),#e8ecf5 0)}
.score-ring>div{width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;align-content:center}
.score-ring strong{font-size:34px;line-height:1;color:var(--pri)}
.score-ring span{font-size:11.5px;color:var(--muted);letter-spacing:.5px}
.rev{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;background:#fff}
.rev .opt{margin-bottom:8px;padding:10px 13px;font-size:13.8px}
.bahas{margin-top:10px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.55}
.tag{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:8px}
.tag.benar{background:#dcfce7;color:#166534}.tag.salah{background:#fee2e2;color:#991b1b}.tag.kosong{background:#f1f5f9;color:#475569}
.score{font-weight:800}.score.ok{color:var(--ok)}.score.bad{color:var(--bad)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
table.tbl th{background:#f8fafc;text-align:left;padding:11px 13px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:11px 13px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:#fafbff}
.q-admin{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:#fff}
.q-admin-text{font-size:14px;color:#1e293b;margin:8px 0 10px;line-height:1.55}
.q-admin-opts div{font-size:13.3px;color:#475569;padding:3px 0;line-height:1.5}
.q-admin-opts div.ok{color:#166534;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:18px;z-index:100;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:680px;max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.ltr-static{flex:0 0 34px;height:38px;border-radius:10px;background:#eef2ff;color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:13px}
.preview-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fafbff}
.preview-item .q{font-size:13px;color:#1e293b;line-height:1.5;margin-bottom:6px}
.preview-item .o{font-size:12px;color:#475569;padding:2px 0}
.preview-item .o.key{color:#166534;font-weight:700}
.preview-badge{display:inline-block;padding:2px 8px;border-radius:6px;background:#eef2ff;color:#4338ca;font-size:10.5px;font-weight:700;margin-bottom:6px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.hero-stat{width:100%}.hero-stat>div{flex:1}.login-card{padding:20px}.card{padding:17px;border-radius:15px}.row.between.wrap{gap:10px}.qtext{font-size:15.5px}.score-ring{width:126px;height:126px}.score-ring>div{width:100px;height:100px}.score-ring strong{font-size:28px}}
</style>
</head>

{k:'Teknis',n:1,q:'Dependent Variabel (DV) dari Demografi formal adalah ...',o:['Tingkat Kelahiran dan Komposisi Umur','Migrasi keluar dan Pertumbuhan Ekonomi','Kemiskinan dan Kebutuhan Pangan','Kebutuhan Pangan dan Tingkat Kelahiran','Komposisi Umur dan Pertumbuhan Ekonomi'],a:0},
{k:'Teknis',n:2,q:'Penduduk Tumbuh Seimbang dapat dicapai apabila ...',o:['TFR 1 dan NRR 2,1','TFR 2,1 dan NRR 2','TFR 2,1 dan NRR 1','CBR 2,1 dan NRR 1'],a:2},
{k:'Teknis',n:3,q:'Jumlah kelahiran setiap 1000 wanita berumur 15-49 tahun disebut sebagai ...',o:['NRR','ASFR','GFR','CBR'],a:2,b:'GFR (General Fertility Rate) = jumlah kelahiran per 1000 wanita usia subur 15-49 tahun.'},
{k:'Teknis',n:4,q:'Angka kematian bayi (IMR) didefinisikan sebagai ...',o:['Jumlah kematian anak berumur 0-5 tahun selama satu tahun tertentu per 1000 anak umur yang sama pada pertengahan tahun tersebut','Jumlah kematian bayi usia kurang dari satu tahun pada suatu tahun tertentu per 1000 kelahiran hidup pada tahun yang sama','Jumlah kematian bayi sebelum berumur satu bulan atau 28 hari per 1000 kelahiran hidup pada suatu tahun tertentu','Banyaknya kematian pada bayi yang berumur antara 1 bulan sampai kurang dari 1 tahun per 1000 kelahiran hidup pada satu tahun tertentu'],a:1},
{k:'Teknis',n:5,q:'Program Bangga Kencana merupakan istilah baru untuk Kependudukan Keluarga Berencana dan Pembangunan Keluarga (KKBPK). Alasan paling tepat terjadinya perubahan istilah tersebut adalah ...',o:['Lebih mendekatkan kepada generasi milenial','Menyesuaikan dengan Nawa Cita ke-3','Amanat UU No. 52 Tahun 2009','Mengikuti RENSTRA BKKBN Tahun 2020-2024'],a:3},

{k:'Teknis',n:9,q:'Di bawah ini yang bukan merupakan prinsip 12 Kaidah Plus yang menjadi landasan dalam pencatatan dan pelaporan program Bangga Kencana adalah ...',o:['Mudah Ditetusuri','Sistematis','Relatif Cepat Berubah','Bersifat Kuantitatif','Terukur'],a:2},
{k:'Teknis',n:10,q:'Kondisi yang timbul dari penggunaan metode kontrasepsi yang berakibat buruk bagi kesehatan klien disebut ...',o:['Kegagalan Alokon','Komplikasi','Dampak Alokon','Pendarahan','Gejala Klinis'],a:1},
{k:'Teknis',n:11,q:'Pemahaman mengenai kesehatan reproduksi dan usia pernikahan anak merupakan isu strategis ...',o:['Satu data kependudukan','Pemenuhan layanan dasar','Membangun kebudayaan dan karakter bangsa','8 (delapan) fungsi keluarga'],a:2},
{k:'Teknis',n:12,q:'Pendekatan yang digunakan dalam pelaksanaan fasilitasi Program Bangga Kencana adalah ...',o:['Tekstual dan Kontekstual','Sistematis dan Terarah','Homogen dan Heterogen','Individu dan Kelompok','Rutin dan Operasional'],a:3},
{k:'Teknis',n:13,q:'Keterampilan menanggapi untuk meningkatkan eksplorasi klien pada konseling yang dilakukan di Satyagatra disebut ...',o:['Diskusi','Pra Konseling','Argumentasi','Personalisasi','Responding'],a:4},
{k:'Teknis',n:14,q:'Dalam konseling terdapat 6 langkah yang dikenal dengan istilah SATU TUJU. Apa arti huruf "T" yang pertama pada istilah tersebut?',o:['Tanyakan','Tunjukkan','Tindakan','Terbuka','Tampilkan'],a:0},
{k:'Teknis',n:15,q:'Kemendukbangga/BKKBN mendukung 3 Prioritas Nasional dalam RPJMN 2025-2029. Yang paling relevan dengan tugas penyuluh KB adalah ...',o:['PN 1, PN 2, PN 3','PN 2, PN 4, PN 6','PN 1, PN 4, PN 5','PN 3, PN 5, PN 7','PN 2, PN 3, PN 4'],a:1},

{k:'Teknis',n:18,q:'Di bawah ini yang bukan merupakan manfaat dari analisis demografi adalah ...',o:['Mempelajari kuantitas dan distribusi penduduk dalam suatu daerah tertentu','Menjelaskan pertumbuhan penduduk pada masa lampau, kecenderungannya, dan persebarannya dengan sebaik-baiknya dengan data yang tersedia','Meningkatkan kesejahteraan penduduk melalui penjaminan memperoleh pendidikan','Mengembangkan hubungan sebab akibat antara perkembangan penduduk dengan bermacam-macam aspek organisasi sosial, ekonomi, budaya, lingkungan dan lain-lain','Memperkirakan pertumbuhan penduduk (proyeksi penduduk) pada masa yang akan datang dan kemungkinan-konsekuensinya'],a:2},

{k:'Teknis',n:21,q:'Akademi Keluarga mengintegrasikan 3 program, yaitu ...',o:['BKB, BKR, BKL','GenRe, PIK Remaja, Sekolah Siaga Kependudukan (SSK)','Genting, Tamasya, GATI','TPK, Kampung KB, UPPKA','GenRe, PIK Remaja, Tamasya'],a:1},
{k:'Teknis',n:22,q:'Di wilayah kerja Anda TFR 2,4; mCPR 55%; unmet need 15%; prevalensi stunting 24%; dan pernikahan dini 18%. Sebagai ahli, Anda diminta membuat prioritas masalah. Urutan prioritas yang paling logis berdasarkan analisis kausal adalah ...',o:['Pernikahan dini, unmet need, stunting','Unmet need, pernikahan dini, unmet need','Unmet need, stunting, pernikahan dini','MCPR, TFR, stunting','Semua sama penting, kerjakan secara acak'],a:0},
{k:'Teknis',n:23,q:'SIDAYA menjawab tantangan aging population. Indonesia diprediksi memasuki era aged society ketika ...',o:['Penduduk lansia > 7% dari total penduduk','Penduduk lansia > 10% dari total penduduk','Penduduk lansia > 14% dari total penduduk','Penduduk lansia > 20% dari total penduduk','Penduduk lansia > 5% dari total penduduk'],a:2,b:'Aging society > 7%, aged society > 14%, super-aged society > 20%.'},
{k:'Teknis',n:24,q:'Dalam konteks pembangunan keluarga, resilience keluarga yang diukur dalam program Bangga Kencana meliputi ...',o:['Hanya ketahanan ekonomi','Ketahanan fisik, psikologis, sosial, ekonomi, dan spiritual','Hanya ketahanan fisik','Hanya ketahanan sosial','Hanya ketahanan ekonomi dan fisik'],a:1},

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function jsEsc(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"'); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmtDate(iso){ try{ return new Date(iso).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}); }catch(e){ return iso; } }
function fmtDur(s){ const m = Math.floor(s/60), r = s%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); }

function getKategoriList(){
  const set = new Set();
  getQuestions().forEach(q => { if(q.kategori && q.kategori.trim()) set.add(q.kategori.trim()); });
  const arr = Array.from(set).sort();
  return ['Semua'].concat(arr);
}
function catColor(kat){
  let h = 0;
  for(let i=0; i<kat.length; i++) h = ((h*31) + kat.charCodeAt(i)) >>> 0;
  return CAT_COLORS[h % CAT_COLORS.length];
}
function katBadge(kat){
  const c = catColor(kat);
  return '<span class="badge" style="background:' + c.bg + ';color:' + c.fg + '">' + esc(kat) + '</span>';
}
function filterByKategori(list, kat){ return kat === 'Semua' ? list.slice() : list.filter(q => q.kategori === kat); }

/* =========================================================
   GOOGLE SHEETS SYNC
   ========================================================= */
function getSyncUrl(){ const st = store.get(KEY.S, {}); return String(st.syncUrl || DEFAULT_SYNC_URL || '').trim(); }
function isSyncReady(){ return /^https?:\/\/.+\/exec$/.test(getSyncUrl()); }

function jsonpGet(url, params, timeout){
  timeout = timeout || 12000;
  return new Promise((resolve, reject) => {
    const cbName = 'jsonp_' + Math.random().toString(36).slice(2);
    const sep = url.indexOf('?') >= 0 ? '&' : '?';
    const q = Object.keys(params || {}).map(k => encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
    const script = document.createElement('script');
    let done = false;
    const cleanup = () => { try{ delete window[cbName]; }catch(_){} script.remove(); };
    const timer = setTimeout(() => { if(done) return; done = true; cleanup(); reject(new Error('timeout')); }, timeout);
    window[cbName] = (data) => { if(done) return; done = true; clearTimeout(timer); cleanup(); resolve(data); };
    script.onerror = () => { if(done) return; done = true; clearTimeout(timer); cleanup(); reject(new Error('network error')); };
    script.src = url + sep + q + (q ? '&' : '') + 'callback=' + cbName;
    document.body.appendChild(script);
  });
}
async function ambilSoalServer(){
  const url = getSyncUrl(); if(!url) return null;
  try{
    const res = await fetch(url + '?action=soal', { cache:'no-store' });
    if(res.ok){ const j = await res.json(); if(Array.isArray(j)) return j; if(j && Array.isArray(j.data)) return j.data; }
  }catch(e){ console.warn('fetch soal gagal, coba JSONP', e); }
  try{ const j = await jsonpGet(url, { action:'soal' }); if(Array.isArray(j)) return j; }
  catch(e){ console.warn('JSONP soal gagal:', e); }
  return null;
}
async function pushSoalKeServer(list){
  const url = getSyncUrl(); if(!url) return { ok:false, reason:'no-url' };
  if(soalSyncing) return { ok:false, reason:'busy' };
  soalSyncing = true;
  try{
    await fetch(url, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'syncSoal', data:list })
    });
    soalSyncing = false;
    showSoalSyncStatus(true);
    return { ok:true };
  }catch(e){
    soalSyncing = false;
    showSoalSyncStatus(false, e.message);
    return { ok:false, error:String(e) };
  }
}
function showSoalSyncStatus(ok, msg){
  const el = document.getElementById('soal-sync-note');
  if(!el) return;
  if(ok){ el.innerHTML = '<span class="pill ok">✓ Soal tersinkron ke Google Sheet (' + getQuestions().length + ' soal, ' + (getKategoriList().length-1) + ' kategori)</span>'; }
  else { el.innerHTML = '<span class="pill bad">✗ Gagal sinkron: ' + esc(msg||'?') + ' — soal hanya tersimpan di perangkat ini</span>'; }
}
async function kirimHasilKeServer(r){
  const url = getSyncUrl(); if(!url) return { ok:false, reason:'no-url' };
  try{
    await fetch(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'simpan', data:r }) });
    return { ok:true };
  }catch(e){ return { ok:false, error:String(e) }; }
}

  const url = getSyncUrl(); if(!url) return;
  try{ await fetch(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'hapus', id }) }); }catch(e){}
}
async function hapusSemuaHasilServer(){
  const url = getSyncUrl(); if(!url) return;
  try{ await fetch(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'hapusSemua' }) }); }catch(e){}
}
async function ambilHasilServer(){
  const url = getSyncUrl(); if(!url) return null;
  try{ const res = await fetch(url + '?action=daftar', { cache:'no-store' });
    if(res.ok){ const j = await res.json(); if(Array.isArray(j)) return j; if(j && Array.isArray(j.data)) return j.data; }
  }catch(e){ console.warn('fetch hasil gagal, coba JSONP', e); }
  try{ const j = await jsonpGet(url, { action:'daftar' }); if(Array.isArray(j)) return j; return []; }
  catch(e){ return null; }
}

  app.innerHTML = viewPeserta();
}

function doLoginPeserta(e){
  e.preventDefault();
  const nama = document.getElementById('in-nama').value.trim();
  const user = document.getElementById('in-user').value.trim().toLowerCase();
  if(!nama || !user) return;
  const users = store.get(KEY.U, []);
  const found = users.find(u => u.username === user);
  if(found){ found.nama = nama; } else { users.push({ username:user, nama: nama }); }
  store.set(KEY.U, users);
  session = { role:'peserta', username:user, nama: nama };
  store.set(KEY.SES, session);
  quiz = null; lastResult = null; render();
  refreshSoalDariServer('peserta');
}
function doLoginAdmin(e){
  e.preventDefault();
  const pass = document.getElementById('in-pass').value;
  const st = store.get(KEY.S, { adminPassword:'admin123' });
  if(pass !== st.adminPassword){ alert('Password admin salah.'); return; }
  session = { role:'admin', username:'admin', nama:'Administrator' };
  store.set(KEY.SES, session);
  quiz = null; lastResult = null; render();
  refreshSoalDariServer('admin');
}
async function refreshSoalDariServer(who){
  if(!isSyncReady()) return;
  const list = await ambilSoalServer();
  if(!Array.isArray(list)) return;
  if(list.length === 0 && who === 'admin'){
    const local = getQuestions();
    if(local.length) pushSoalKeServer(local);
    return;
  }
  if(list.length > 0){
    store.set(KEY.Q, list);
    if(who === 'admin' && adminTab === 'soal'){ render(); }
    else if(who === 'peserta' && !quiz && !lastResult){ render(); }
  }
}
function logout(){
  session = null; quiz = null; lastResult = null; adminTab = 'soal';

}

function startQuiz(){
  const all = getQuestions();
  let items;
  if(pick.mode === 'semua'){ items = filterByKategori(all, pick.kategori); }
  else { items = all.filter(q => pick.selected.indexOf(q.id) >= 0); if(!items.length){ alert('Pilih minimal satu soal terlebih dahulu.'); return; } }
  if(!items.length){ alert('Belum ada soal pada kategori ini.'); return; }
  items.sort((a,b) => a.kategori.localeCompare(b.kategori) || a.nomor - b.nomor);
  if(pick.acak) items = shuffle(items);
  quiz = { ids: items.map(q => q.id), answers:{}, idx:0, start: Date.now(), kategori: pick.kategori, acak: pick.acak };
  lastResult = null; render();
}
function startTimer(){
  clearInterval(timerInt);
  timerInt = setInterval(() => {
    const el = document.getElementById('timer');
    if(!el || !quiz){ clearInterval(timerInt); return; }
    el.textContent = fmtDur(Math.floor((Date.now() - quiz.start)/1000));
  }, 1000);
}
function viewQuiz(){
  const all = getQuestions();
  const q = all.find(x => x.id === quiz.ids[quiz.idx]);
  if(!q){ quiz = null; render(); return ''; }
  const total = quiz.ids.length;
  const answered = Object.keys(quiz.answers).length;
  const opts = q.opsi.map((t,i)=>({t,i})).filter(o => o.t && o.t.trim());
  return topbar(q.kategori + ' - Soal ' + (quiz.idx+1) + ' dari ' + total,
    '<span class="pill">Waktu: <b id="timer">00:00</b></span><span class="pill">Terjawab: ' + answered + '/' + total + '</span>') +
    '<div class="container narrow"><div class="card">' +
      '<div class="row between">' + katBadge(q.kategori) +
        '<span class="muted small">Soal No. ' + q.nomor + '</span></div>' +
      '<h3 class="qtext">' + esc(q.pertanyaan) + '</h3><div>' +
      opts.map(o => '<button class="opt ' + (quiz.answers[q.id]===o.i?'sel':'') + '" onclick="pilihOpsi(' + o.i + ')">' +
        '<span class="ltr">' + LETTERS[o.i] + '</span><span>' + esc(o.t) + '</span></button>').join('') +
      '</div><div class="row between wrap" style="margin-top:18px">' +
        '<button class="btn ghost" onclick="navQ(-1)" ' + (quiz.idx===0?'disabled':'') + '>Sebelumnya</button>' +
        '<div class="row gap"><button class="btn ghost" onclick="finishQuiz()">Selesai & Nilai</button>' +
          '<button class="btn primary" onclick="' + (quiz.idx===total-1?'finishQuiz()':'navQ(1)') + '">' +
          (quiz.idx===total-1?'Selesai':'Selanjutnya') + '</button></div></div>' +
      '<div class="palette">' + quiz.ids.map((id,i) => '<button class="pal ' + (quiz.answers[id]!==undefined?'done':'') + ' ' + (i===quiz.idx?'cur':'') + '" onclick="gotoQ(' + i + ')">' + (i+1) + '</button>').join('') + '</div>' +
    '</div></div>';
}
function pilihOpsi(i){ quiz.answers[quiz.ids[quiz.idx]] = i; render(); }
function gotoQ(i){ quiz.idx = i; render(); }
function navQ(d){ const n = quiz.idx + d; if(n < 0 || n >= quiz.ids.length) return; quiz.idx = n; render(); }

function finishQuiz(){
  const all = getQuestions();
  const kosongCount = quiz.ids.length - Object.keys(quiz.answers).length;
  if(kosongCount > 0 && !confirm('Masih ada ' + kosongCount + ' soal yang belum dijawab. Tetap selesaikan?')) return;
  let benar = 0, salah = 0, kosong = 0;
  const detail = quiz.ids.map(id => {
    const q = all.find(x => x.id === id) || { nomor:'?', kategori:'-', pertanyaan:'(soal dihapus)', opsi:[], jawaban:-1, pembahasan:'' };
    const dipilih = quiz.answers[id];
    let status; if(dipilih === undefined) status = 'kosong'; else if(dipilih === q.jawaban) status = 'benar'; else status = 'salah';
    if(status === 'benar') benar++; else if(status === 'salah') salah++; else kosong++;
    return { id:id, nomor:q.nomor, kategori:q.kategori, pertanyaan:q.pertanyaan, opsi:q.opsi, jawaban:q.jawaban,
      dipilih: (dipilih===undefined?null:dipilih), status:status, pembahasan: q.pembahasan || '' };
  });
  const total = quiz.ids.length;
  const nilai = Math.round(benar / total * 100);
  const res = { id: uid(), username: session.username, nama: session.nama, kategori: quiz.kategori,
    tanggal: new Date().toISOString(), total: total, benar: benar, salah: salah, kosong: kosong,
    nilai: nilai, detail: detail, durasi: Math.round((Date.now() - quiz.start)/1000) };
  const rs = store.get(KEY.R, []); rs.unshift(res); store.set(KEY.R, rs);
  lastResult = Object.assign({}, res, { _fresh:true });
  quiz = null; clearInterval(timerInt); render(); window.scrollTo({top:0, behavior:'smooth'});
  kirimHasilKeServer(res).then(out => {
    const el = document.getElementById('sync-note'); if(!el) return;
    if(out.ok) el.innerHTML = '<span class="pill ok">Hasil terkirim ke server</span>';
    else if(out.reason === 'no-url') el.innerHTML = '<span class="pill">Mode lokal — hasil tersimpan di perangkat ini.</span>';
    else el.innerHTML = '<span class="pill bad">Gagal mengirim ke server. Hasil tetap tersimpan di perangkat ini.</span>';
  });
}

function unduhHasilSaya(){ downloadJSON(lastResult, 'hasil-' + lastResult.username + '-' + lastResult.id + '.json'); }
function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

async function refreshSoalManual(){
  if(!isSyncReady()){ alert('URL Apps Script belum diatur di Pengaturan.'); return; }
  const note = document.getElementById('soal-sync-note');
  if(note) note.innerHTML = '<span class="pill">Memuat soal dari server...</span>';
  const list = await ambilSoalServer();
  if(!Array.isArray(list)){
    if(note) note.innerHTML = '<span class="pill bad">Gagal memuat dari server.</span>';
    return;
  }
  if(list.length === 0){
    if(note) note.innerHTML = '<span class="pill">Sheet Soal kosong. Soal lokal akan didorong ke server sebagai data awal.</span>';
    const local = getQuestions();
    if(local.length){ await pushSoalKeServer(local); render(); }
    return;
  }
  store.set(KEY.Q, list); render();
  alert('Berhasil memuat ' + list.length + ' soal dari server (' + (getKategoriList().length-1) + ' kategori).');

function simpanSoal(id){

/* ---------- IMPORT SOAL (CSV/JSON) ---------- */
function importSoalFile(input){
  const f = input.files[0]; if(!f) return;
  const name = f.name.toLowerCase();
  const rd = new FileReader();
  rd.onload = function(){
    try{
      let list = [];
      if(name.endsWith('.json')){
        const data = JSON.parse(rd.result);
        const arr = Array.isArray(data) ? data : (data.questions || []);
        list = arr.map(normalizeImportedQ);
      } else { list = parseCSVQuestions(rd.result); }
      list = list.filter(q => q && q.pertanyaan);
      if(!list.length){ alert('Tidak ada soal valid di file tersebut.'); input.value=''; return; }
      const existing = getQuestions();
      const counter = {}; existing.forEach(q => { counter[q.kategori] = Math.max(counter[q.kategori]||0, Number(q.nomor)||0); });
      list.forEach(q => { counter[q.kategori] = (counter[q.kategori]||0) + 1; q.nomor = counter[q.kategori]; q.id = uid(); existing.push(q); });
      setQuestions(existing); input.value = ''; render();
      alert(list.length + ' soal berhasil ditambahkan. Total sekarang: ' + existing.length + ' soal, ' + (getKategoriList().length-1) + ' kategori.');
    }catch(e){ alert('File tidak valid: ' + e.message); }
  };
  rd.readAsText(f, 'UTF-8');
}
function normalizeImportedQ(raw){
  if(!raw || !raw.pertanyaan) return null;
  let opsi = Array.isArray(raw.opsi) ? raw.opsi.slice(0,5) : [];
  while(opsi.length < 5) opsi.push('');
  let jaw = raw.jawaban;
  if(typeof jaw === 'string'){ const t = jaw.trim().toUpperCase(); const idx = LETTERS.indexOf(t); jaw = idx >= 0 ? idx : (Number(t) - 1); }
  if(typeof jaw !== 'number' || isNaN(jaw) || jaw < 0 || jaw > 4) jaw = 0;
  return { kategori: (raw.kategori || 'Teknis').trim(), nomor: Number(raw.nomor) || 1,
    pertanyaan: String(raw.pertanyaan).trim(), opsi: opsi.map(s => String(s||'').trim()),
    jawaban: jaw, pembahasan: String(raw.pembahasan || '').trim() };
}
function parseCSVQuestions(text){
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(l => l.trim());
  if(!lines.length) return [];
  const first = lines[0];
  const delim = (first.split(';').length >= first.split(',').length) ? ';' : ',';
  const rows = lines.map(line => parseCSVLine(line, delim));
  const head = rows.shift().map(h => h.trim().toLowerCase());
  const find = function(){ for(let i=0; i<arguments.length; i++){ const idx = head.indexOf(arguments[i]); if(idx >= 0) return idx; } return -1; };
  const iKat=find('kategori','category'), iNom=find('nomor','no','number'), iQ=find('pertanyaan','question','soal');
  const iA=find('opsi_a','opsia','a','pilihan_a'), iB=find('opsi_b','opsib','b','pilihan_b'),
        iC=find('opsi_c','opsic','c','pilihan_c'), iD=find('opsi_d','opsid','d','pilihan_d'),
        iE=find('opsi_e','opsie','e','pilihan_e');
  const iJ=find('jawaban','kunci','answer','key'), iP=find('pembahasan','penjelasan','explanation');
  if(iQ < 0) throw new Error('Kolom "pertanyaan" tidak ada di header CSV. Lihat tombol Template.');
  return rows.map(r => {
    const get = i => i >= 0 ? (r[i] || '').trim() : '';
    return normalizeImportedQ({ kategori:get(iKat), nomor:get(iNom), pertanyaan:get(iQ),
      opsi:[get(iA),get(iB),get(iC),get(iD),get(iE)], jawaban:get(iJ), pembahasan:get(iP) });
  }).filter(q => q && q.pertanyaan);
}
function parseCSVLine(line, delim){
  const out = []; let cur = '', inQ = false;
  for(let i=0; i<line.length; i++){
    const ch = line[i];
    if(inQ){ if(ch === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else inQ = false; } else cur += ch; }
    else { if(ch === '"') inQ = true; else if(ch === delim){ out.push(cur); cur = ''; } else cur += ch; }
  }
  out.push(cur); return out;
}
function downloadSoalTemplate(){
  const head = ['kategori','nomor','pertanyaan','opsi_a','opsi_b','opsi_c','opsi_d','opsi_e','jawaban','pembahasan'];
  const ex1 = ['Teknis','1','Apa kepanjangan TFR?','Total Fertility Rate','Tingkat Fertilitas Rendah','Total Fertilitas Rata-rata','Total Fekunditas Rate','Tingkat Fekunditas Rata-rata','A','TFR = Total Fertility Rate.'];
  const ex2 = ['Manajerial','1','Fungsi utama POAC adalah...','Planning','Organizing','Actuating','Controlling','Evaluasi','A','POAC = Planning, Organizing, Actuating, Controlling.'];
  const csv = '\uFEFF' + [head, ex1, ex2].map(row => row.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(';')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'template-soal.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

async function loadWordFile(input){

function prosesImportWord(){
  const raw = document.getElementById('wi-text').value;

  if(!parsed.length){ if(status) status.innerHTML = '<span class="pill bad">Tidak ada soal terdeteksi.</span>'; return; }

function parseSoalText(text, defaultKat){
  text = String(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/\f/g,'\n').replace(/\u00A0/g,' ');
  const lines = text.split('\n');
  const questions = [];
  let cur = null, mode = null;
  let kategori = defaultKat || 'Teknis';
  const reKat = /^\s*(?:kategori|category)\s*[:\-]\s*(.+)$/i;
  const reQ = /^\s*(\d+)\s*[\.\)]\s*(.+)$/;
  const reOpt = /^\s*([A-Ea-e])\s*[\.\)]\s*(.+)$/;
  const reAns = /^\s*(?:jawaban|kunci|answer|key)\s*[:\-]?\s*([A-Ea-e]|\d)\b/i;
  const reBahas = /^\s*(?:pembahasan|penjelasan|bahas|explanation)\s*[:\-]\s*(.*)$/i;
  function flush(){
    if(cur && cur.pertanyaan && cur.pertanyaan.trim()){
      while(cur.opsi.length < 5) cur.opsi.push('');
      if(cur.jawaban == null) cur.jawaban = 0;
      if(cur.jawaban < 0 || cur.jawaban > 4) cur.jawaban = 0;
      if(!cur.opsi[cur.jawaban] || !cur.opsi[cur.jawaban].trim()){
        for(let k=0; k<5; k++){ if(cur.opsi[k] && cur.opsi[k].trim()){ cur.jawaban = k; break; } }
      }
      questions.push(cur);
    }
    cur = null; mode = null;
  }
  for(let i=0; i<lines.length; i++){
    const ln = lines[i].replace(/\s+$/,'').replace(/^\s+/,'');
    if(!ln) continue;
    const mKat = ln.match(reKat);
    if(mKat){
      let k = mKat[1].trim();
      if(/sosio/i.test(k)) kategori = 'Sosiokultural';
      else if(/^teknis$/i.test(k)) kategori = 'Teknis';
      else kategori = k;
      continue;
    }
    const mQ = ln.match(reQ);
    if(mQ){ flush(); cur = { kategori: kategori, pertanyaan: mQ[2].trim(), opsi: [], jawaban: null, pembahasan: '' }; mode = 'q'; continue; }
    const mOpt = ln.match(reOpt);
    if(mOpt && cur && mode !== 'bahas'){
      const idx = LETTERS.indexOf(mOpt[1].toUpperCase());
      if(idx >= 0){ cur.opsi[idx] = mOpt[2].trim(); mode = 'opt'; continue; }
    }
    const mAns = ln.match(reAns);
    if(mAns && cur){
      const v = mAns[1].toUpperCase();
      const idx = LETTERS.indexOf(v);
      cur.jawaban = idx >= 0 ? idx : Math.max(0, Math.min(4, Number(v)-1));
      mode = 'ans'; continue;
    }
    const mBah = ln.match(reBahas);
    if(mBah && cur){ cur.pembahasan = mBah[1].trim(); mode = 'bahas'; continue; }
    if(cur){
      if(mode === 'q') cur.pertanyaan += ' ' + ln.trim();
      else if(mode === 'bahas') cur.pembahasan += ' ' + ln.trim();
      else if(mode === 'opt'){ for(let j=4; j>=0; j--){ if(cur.opsi[j]){ cur.opsi[j] += ' ' + ln.trim(); break; } } }
    }
  }
  flush();
  return questions.map(q => ({ kategori: q.kategori, nomor: 1, pertanyaan: q.pertanyaan,
    opsi: q.opsi.slice(0,5), jawaban: q.jawaban, pembahasan: q.pembahasan }));
}

function exportCSV(){
  const rs = currentResultsList.length ? currentResultsList : store.get(KEY.R, []);
  if(!rs.length){ alert('Belum ada data untuk diekspor.'); return; }
  const head = ['Nama','Username','Kategori','Tanggal','Jumlah Soal','Benar','Salah','Kosong','Nilai','Durasi (detik)'];
  const rows = rs.map(r => [r.nama, r.username, r.kategori, fmtDate(r.tanggal), r.total, r.benar, r.salah, r.kosong, r.nilai, r.durasi||0]);
  const csv = '\uFEFF' + [head].concat(rows).map(row => row.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(';')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'hasil-ujian-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function importHasil(input){

  const rd = new FileReader();
  rd.onload = () => {
    try{
      let data = JSON.parse(rd.result); if(!Array.isArray(data)) data = [data];
      const cur = store.get(KEY.R, []); const ids = new Set(cur.map(r => r.id)); let added = 0;
      data.forEach(r => { if(r && r.id && r.detail && !ids.has(r.id)){ cur.push(r); ids.add(r.id); added++; } });
      store.set(KEY.R, cur); render(); alert(added + ' hasil berhasil diimpor.');
    }catch(e){ alert('File tidak valid: ' + e.message); }
  };

}

/* ---------- PENGATURAN ---------- */
const APPS_SCRIPT_CODE = `const SHEET='Hasil';
const SHEET_SOAL='Soal';
const HEADERS=['id','username','nama','kategori','tanggal','total','benar','salah','kosong','nilai','durasi','detail'];
const HEADERS_SOAL=['id','kategori','nomor','pertanyaan','opsi_a','opsi_b','opsi_c','opsi_d','opsi_e','jawaban','pembahasan'];
const L=['A','B','C','D','E'];

function doPost(e){
  try{
    const b=JSON.parse(e.postData.contents);
    const a=b.action;
    if(a==='simpan'){
      const sh=getSheet(SHEET,HEADERS),d=b.data;
      sh.appendRow([d.id,d.username,d.nama,d.kategori,d.tanggal,d.total,d.benar,d.salah,d.kosong,d.nilai,d.durasi||0,JSON.stringify(d.detail||[])]);
      return out({ok:true});
    }
    if(a==='hapus'){
      const sh=getSheet(SHEET,HEADERS),v=sh.getDataRange().getValues();
      for(let i=v.length-1;i>=1;i--){if(String(v[i][0])===String(b.id))sh.deleteRow(i+1);}
      return out({ok:true});
    }
    if(a==='hapusSemua'){
      const sh=getSheet(SHEET,HEADERS);
      if(sh.getLastRow()>1)sh.deleteRows(2,sh.getLastRow()-1);
      return out({ok:true});
    }
    if(a==='syncSoal'){
      const sh=getSheet(SHEET_SOAL,HEADERS_SOAL);
      if(sh.getLastRow()>1)sh.deleteRows(2,sh.getLastRow()-1);
      const arr=b.data||[];
      if(arr.length){
        const rows=arr.map(q=>[q.id,q.kategori,q.nomor,q.pertanyaan,q.opsi[0]||'',q.opsi[1]||'',q.opsi[2]||'',q.opsi[3]||'',q.opsi[4]||'',L[q.jawaban]||'A',q.pembahasan||'']);
        sh.getRange(2,1,rows.length,HEADERS_SOAL.length).setValues(rows);
      }
      return out({ok:true,count:arr.length});
    }
    return out({ok:false,error:'aksi tidak dikenal: '+a});
  }catch(err){return out({ok:false,error:String(err)});}
}

function doGet(e){
  const a=(e&&e.parameter&&e.parameter.action)||'';
  const cb=e&&e.parameter&&e.parameter.callback;
  if(a==='ping')return out({ok:true,status:'ok',versi:2,waktu:new Date().toISOString()},cb);
  if(a==='daftar'){
    const sh=getSheet(SHEET,HEADERS);
    if(sh.getLastRow()<2)return out([],cb);
    const v=sh.getDataRange().getValues(),h=v.shift();
    const rows=v.map(r=>{const o={};h.forEach((x,i)=>o[x]=r[i]);try{o.detail=JSON.parse(o.detail||'[]');}catch(_){o.detail=[];}return o;});
    return out(rows.reverse(),cb);
  }
  if(a==='soal'){
    const sh=getSheet(SHEET_SOAL,HEADERS_SOAL);
    if(sh.getLastRow()<2)return out([],cb);
    const v=sh.getDataRange().getValues(),h=v.shift();
    const rows=v.map(r=>{const o={};h.forEach((x,i)=>o[x]=r[i]);return{id:String(o.id||''),kategori:String(o.kategori||'Teknis'),nomor:Number(o.nomor)||1,pertanyaan:String(o.pertanyaan||''),opsi:[o.opsi_a||'',o.opsi_b||'',o.opsi_c||'',o.opsi_d||'',o.opsi_e||''],jawaban:Math.max(0,L.indexOf(String(o.jawaban||'A').toUpperCase())),pembahasan:String(o.pembahasan||'')};});
    return out(rows,cb);
  }
  return out({ok:true,pesan:'Actions: ping, daftar, soal'},cb);
}

function getSheet(name,headers){
  const ss=SpreadsheetApp.getActiveSpreadsheet();
  let sh=ss.getSheetByName(name);
  if(!sh){sh=ss.insertSheet(name);sh.appendRow(headers);}
  return sh;
}
function out(o,cb){
  const j=JSON.stringify(o);
  if(cb&&/^[a-zA-Z0-9_$.]+$/.test(cb)){return ContentService.createTextOutput(cb+'('+j+')').setMimeType(ContentService.MimeType.JAVASCRIPT);}
  return ContentService.createTextOutput(j).setMimeType(ContentService.MimeType.JSON);
}
`;

function simpanSyncUrl(){
  const v = document.getElementById('sync-url').value.trim();
  if(v && !/^https?:\/\/.+\/exec$/.test(v)){ if(!confirm('URL tidak berakhiran /exec. Tetap disimpan?')) return; }
  const st = store.get(KEY.S, {}); st.syncUrl = v; store.set(KEY.S, st); testSync();
}
async function testSync(){
  const box = document.getElementById('sync-test'); if(!box) return;
  box.innerHTML = '<span class="pill">Menguji...</span>';
  const url = getSyncUrl();
  if(!url){ box.innerHTML = '<span class="pill bad">URL belum diisi.</span>'; return; }
  try{ const r = await fetch(url + '?action=ping', {cache:'no-store'}); const j = await r.json();
    if(j && j.ok){ box.innerHTML = '<span class="pill ok">Backend terhubung (versi ' + (j.versi||'?') + ').</span>'; return; }
  }catch(e){}
  try{ const j = await jsonpGet(url, {action:'ping'});
    if(j && j.ok){ box.innerHTML = '<span class="pill ok">Backend terhubung (JSONP, versi ' + (j.versi||'?') + ').</span>'; return; }
  }catch(e){}
  box.innerHTML = '<span class="pill bad">Gagal terhubung. Cek: (1) URL /exec, (2) deployment Anyone, (3) sudah Deploy versi baru.</span>';
}
function copyAppsScript(btn){
  const text = APPS_SCRIPT_CODE;
  const done = () => { const old = btn.textContent; btn.textContent = 'Tersalin!'; setTimeout(() => btn.textContent = old, 1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(() => { fallbackCopy(text); done(); }); }
  else { fallbackCopy(text); done(); }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta);
}

    try{

      if(d.questions) setQuestions(d.questions);
