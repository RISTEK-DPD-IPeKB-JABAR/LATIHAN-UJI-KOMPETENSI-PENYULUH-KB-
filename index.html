<!DOCTYPE html>

<title>Latihan Soal Penyuluh KB — Try Out Ujikom</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--pri:#4f46e5;--pri-d:#4338ca;--teal:#0d9488;--ink:#0f172a;--muted:#64748b;--line:#e5e9f2;--ok:#16a34a;--bad:#dc2626;--shadow:0 14px 40px -18px rgba(15,23,42,.35)}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;background:radial-gradient(900px 520px at 0% -10%,#dbeafe 0%,transparent 60%),radial-gradient(820px 520px at 100% 0%,#ccfbf1 0%,transparent 55%),#f6f8fc;min-height:100vh}

code{background:#eef2ff;color:var(--pri-d);padding:1px 6px;border-radius:6px;font-size:12.5px}

.container{max-width:1100px;margin:0 auto;padding:22px 18px 70px}.narrow{max-width:840px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}

.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
label{display:block;font-size:13px;font-weight:600;color:#334155;margin:12px 0 6px}
.input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;font-size:14.5px;font-family:inherit;color:var(--ink);background:#fff;outline:none;transition:.15s}
.input:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(79,70,229,.12)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:.15s}
.btn:hover{background:#f8fafc;transform:translateY(-1px)}.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--pri),#6366f1);color:#fff;border-color:transparent;box-shadow:0 10px 22px -12px rgba(79,70,229,.9)}
.btn.primary:hover{background:linear-gradient(135deg,var(--pri-d),#4f46e5)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#fecaca;background:#fef2f2}
.btn.danger:hover{background:#fee2e2}
.btn.doubt{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.btn.doubt:hover{background:#fde68a}
.btn.doubt.active{background:linear-gradient(135deg,#f59e0b,#d97706);border-color:transparent;color:#fff}
.btn.tiny{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%;margin-top:18px}
.row{display:flex;align-items:center;gap:10px}.row.gap{gap:10px}.row.between{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.hint{font-size:12px;color:var(--muted);margin-top:18px;text-align:center;line-height:1.6}
.chips{display:flex;gap:9px;flex-wrap:wrap}

.chip:hover{border-color:#c7d2fe}

.badge{display:inline-block;padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:700;letter-spacing:.2px}

.hero{display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#eef2ff 0%,#f0fdfa 100%)}
.hero-stat{display:flex;gap:14px}
.hero-stat>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 16px;text-align:center;min-width:92px}
.hero-stat strong{display:block;font-size:20px;color:var(--pri)}
.hero-stat span{font-size:11.5px;color:var(--muted)}
.stats{display:flex;gap:14px;flex-wrap:wrap}
.stats>div{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px 20px;text-align:center;min-width:110px}
.stats strong{display:block;font-size:22px;color:var(--pri)}.stats span{font-size:12px;color:var(--muted)}
.picker{margin-top:16px;border:1px dashed var(--line);border-radius:14px;padding:14px;background:#fbfcff}
.picker-list{max-height:330px;overflow:auto;margin:8px 0}
.pick-item{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;cursor:pointer;font-weight:400;margin:0;transition:.12s}
.pick-item:hover{background:#eef2ff}
.pick-item input{margin-top:3px;accent-color:var(--pri);flex:0 0 auto}
.pick-text{font-size:13.3px;color:#334155;line-height:1.45}
.switch{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:#475569;margin:0;cursor:pointer}

.qtext{font-size:16.5px;line-height:1.55;margin:14px 0 18px;color:#111827}

.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:14.5px;font-family:inherit;color:inherit;margin-bottom:10px;transition:.15s;line-height:1.5}
.opt:hover{border-color:#c7d2fe;background:#f8faff}
.opt.sel{border-color:var(--pri);background:#eef2ff;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.opt .ltr{flex:0 0 28px;height:28px;border-radius:9px;background:#eef2ff;color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:13px}
.opt.sel .ltr{background:var(--pri);color:#fff}
.opt.static{cursor:default}.opt.static:hover{border-color:var(--line);background:#fff;transform:none}
.opt.correct{border-color:#86efac;background:#f0fdf4}.opt.correct .ltr{background:var(--ok);color:#fff}
.opt.wrong{border-color:#fecaca;background:#fef2f2}.opt.wrong .ltr{background:var(--bad);color:#fff}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.pal{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:#f8fafc;font-weight:700;font-size:12px;color:#64748b;cursor:pointer;font-family:inherit;transition:.12s}
.pal:hover{border-color:#c7d2fe;transform:scale(1.08)}
.pal.done{background:#dcfce7;border-color:#86efac;color:#166534}
.pal.doubt{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.pal.cur{outline:2.5px solid var(--pri);outline-offset:1px}
.quiz-layout{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:start}
.quiz-nav{position:sticky;top:74px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.quiz-nav h4{margin:0 0 10px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.legend{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:10.5px;color:var(--muted)}
.legend b{display:inline-flex;align-items:center;gap:5px;font-weight:500}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid}
.result-head{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.score-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:conic-gradient(var(--pri) calc(var(--p)*1%),#e8ecf5 0)}
.score-ring>div{width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;align-content:center}
.score-ring strong{font-size:34px;line-height:1;color:var(--pri)}
.score-ring span{font-size:11.5px;color:var(--muted);letter-spacing:.5px}
.rev{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;background:#fff}
.rev .opt{margin-bottom:8px;padding:10px 13px;font-size:13.8px}
.rev.ragu{border-color:#fcd34d;background:#fffbeb}
.bahas{margin-top:10px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.55}
.tag{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:8px}
.tag.benar{background:#dcfce7;color:#166534}.tag.salah{background:#fee2e2;color:#991b1b}.tag.kosong{background:#f1f5f9;color:#475569}.tag.ragu{background:#fef3c7;color:#92400e}
.score{font-weight:800}.score.ok{color:var(--ok)}.score.bad{color:var(--bad)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
table.tbl th{background:#f8fafc;text-align:left;padding:11px 13px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:11px 13px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:#fafbff}
.q-admin{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:#fff}
.q-admin-text{font-size:14px;color:#1e293b;margin:8px 0 10px;line-height:1.55}
.q-admin-opts div{font-size:13.3px;color:#475569;padding:3px 0;line-height:1.5}
.q-admin-opts div.ok{color:#166534;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:18px;z-index:100;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:680px;max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.ltr-static{flex:0 0 34px;height:38px;border-radius:10px;background:#eef2ff;color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:13px}
.preview-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fafbff}
.preview-item .q{font-size:13px;color:#1e293b;line-height:1.5;margin-bottom:6px}
.preview-item .o{font-size:12px;color:#475569;padding:2px 0}
.preview-item .o.key{color:#166534;font-weight:700}
.preview-badge{display:inline-block;padding:2px 8px;border-radius:6px;background:#eef2ff;color:#4338ca;font-size:10.5px;font-weight:700;margin-bottom:6px}
.lb-list{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lb-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid #f1f5f9;background:#fff;transition:.15s}
.lb-item:last-child{border-bottom:none}
.lb-item.rank-1{background:linear-gradient(90deg,#fffbeb,#fff)}
.lb-item.rank-2{background:linear-gradient(90deg,#f8fafc,#fff)}
.lb-item.rank-3{background:linear-gradient(90deg,#fef3c7,#fff)}
.lb-rank{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0}
.lb-rank.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff}
.lb-rank.silver{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff}
.lb-rank.bronze{background:linear-gradient(135deg,#d97706,#b45309);color:#fff}
.lb-rank.normal{background:#f1f5f9;color:#64748b;border:1px solid var(--line)}
.lb-info{flex:1;min-width:0}
.lb-name{font-weight:700;font-size:14px;color:#0f172a}
.lb-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.lb-score{text-align:right;flex-shrink:0}
.lb-score b{font-size:24px;font-weight:800;color:var(--pri)}
.lb-score small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:1px}
.kenaikan-card{border:1px solid #86efac;background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-radius:14px;padding:16px;margin-bottom:12px}
.kenaikan-card .krow{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.kenaikan-card .kname{font-weight:800;font-size:15px;color:#166534;margin-bottom:6px}
.kenaikan-card .kfrom{font-size:12px;color:#475569;margin-bottom:3px}
.kenaikan-card .kfrom b{color:#64748b;text-decoration:line-through}
.kenaikan-card .karrow{font-size:12px;color:#166534;font-weight:700;margin:4px 0}
.kenaikan-card .kto{font-size:13.5px;color:#166534;font-weight:800}
.kenaikan-card .kscore{font-size:28px;font-weight:800;color:#166534;text-align:right}
.kenaikan-card .kscore small{display:block;font-size:10.5px;color:#166534;font-weight:600}
.jenjang-badge{display:inline-block;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;background:#f1f5f9;color:#475569;border:1px solid var(--line);white-space:nowrap}
.jenjang-badge.naik{background:#dcfce7;color:#166534;border-color:#86efac}
.jenjang-badge.utama{background:#ede9fe;color:#6d28d9;border-color:#c4b5fd}
.doubt-note{background:#fef3c7;border:1px solid #fcd34d;color:#92400e;border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:12px;line-height:1.5}
.empty-state{text-align:center;padding:30px 20px}
.empty-state .icon{font-size:52px;margin-bottom:14px}
.empty-state h2{color:var(--ink);margin-bottom:10px}
.empty-state p{max-width:520px;margin:0 auto 20px}
.empty-action{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;max-width:680px;margin:22px auto 0;text-align:left}
.empty-action .btn{justify-content:flex-start;padding:16px 18px;border-radius:14px}
.empty-action .btn small{display:block;font-weight:400;color:#64748b;font-size:11.5px;margin-top:3px}
.empty-action .btn.primary small{color:rgba(255,255,255,.85)}
.jenjang-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.jenjang-check{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:12.5px;font-weight:500;cursor:pointer;margin:0;background:#fff;transition:.12s}
.jenjang-check:hover{border-color:#c7d2fe;background:#f8faff}
.jenjang-check input{accent-color:var(--pri);width:15px;height:15px;flex-shrink:0}
.jenjang-check.all{border-color:#86efac;background:#f0fdf4;font-weight:700;grid-column:1/-1}
.jenjang-check.all.checked{background:linear-gradient(135deg,#dcfce7,#bbf7d0)}
.jenjang-tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;background:#eef2ff;color:#4338ca;margin-right:3px;margin-top:3px}
@media(max-width:720px){.quiz-layout{grid-template-columns:1fr}.quiz-nav{position:static}}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.hero-stat{width:100%}.hero-stat>div{flex:1}.login-card{padding:20px}.card{padding:17px;border-radius:15px}.row.between.wrap{gap:10px}.qtext{font-size:15.5px}.score-ring{width:126px;height:126px}.score-ring>div{width:100px;height:100px}.score-ring strong{font-size:28px}.lb-score b{font-size:20px}.jenjang-grid{grid-template-columns:1fr}}

/* Helper: assign jenjang tag berdasarkan nomor soal (untuk bootstrap)
   Soal 1-10 Teknis = semua jenjang; 11-20 = Mahir ke atas; dst. */
function bootstrapJenjang(kat, nomor){
  if(kat === 'Sosiokultural') return 'Semua';
  if(nomor <= 10) return 'Semua';
  if(nomor <= 20) return 'Penyuluh KB Mahir, Penyuluh KB Penyelia, Penyuluh KB Ahli Pertama, Penyuluh KB Ahli Muda, Penyuluh KB Ahli Madya, Penyuluh KB Ahli Utama';
  if(nomor <= 30) return 'Penyuluh KB Penyelia, Penyuluh KB Ahli Pertama, Penyuluh KB Ahli Muda, Penyuluh KB Ahli Madya, Penyuluh KB Ahli Utama';
  if(nomor <= 40) return 'Penyuluh KB Ahli Pertama, Penyuluh KB Ahli Muda, Penyuluh KB Ahli Madya, Penyuluh KB Ahli Utama';
  return 'Penyuluh KB Ahli Muda, Penyuluh KB Ahli Madya, Penyuluh KB Ahli Utama';
}

/* =========================================================

   ========================================================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function jsEsc(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"'); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmtDate(iso){ try{ return new Date(iso).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}); }catch(e){ return iso; } }
function fmtDur(s){ const m = Math.floor(s/60), r = s%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); }

/* =========================================================
   JENJANG HELPERS
   ========================================================= */
function jenjangMatches(questionJenjang, userJenjang){
  const q = String(questionJenjang || '').trim();
  if(!q || /^semua$/i.test(q)) return true;
  const u = String(userJenjang || '').toLowerCase();
  if(!u) return true;
  const targets = q.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
  return targets.some(t => u.includes(t) || t.includes(u));
}
function shortJenjang(full){
  return String(full || '').replace(/^Penyuluh KB\s+/i, '');
}
function jenjangBadge(full){
  if(!full) return '<span class="jenjang-badge">-</span>';
  const isHigh = /ahli utama|ahli madya/i.test(full);
  return '<span class="jenjang-badge' + (isHigh?' utama':'') + '">' + esc(shortJenjang(full)) + '</span>';
}

function catColor(kat){ let h=0; for(let i=0;i<kat.length;i++) h=((h*31)+kat.charCodeAt(i))>>>0; return CAT_COLORS[h%CAT_COLORS.length]; }

function getSyncUrl(){ const st=store.get(KEY.S, {}); return String(st.syncUrl||'').trim(); }
function isSyncReady(){ return /^https?:\/\/.+\/exec$/.test(getSyncUrl()); }
function getAutoPoll(){ const st=store.get(KEY.S, {}); return st.autoPoll !== false; }

function jsonpGet(url, params, timeout){
  timeout = timeout || 12000;
  return new Promise((resolve, reject) => {
    const cbName = 'jsonp_' + Math.random().toString(36).slice(2);
    const sep = url.indexOf('?') >= 0 ? '&' : '?';
    const q = Object.keys(params||{}).map(k => encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
    const script = document.createElement('script');
    let done = false;
    const cleanup = () => { try{ delete window[cbName]; }catch(_){} script.remove(); };
    const timer = setTimeout(() => { if(done) return; done=true; cleanup(); reject(new Error('timeout')); }, timeout);
    window[cbName] = (data) => { if(done) return; done=true; clearTimeout(timer); cleanup(); resolve(data); };
    script.onerror = () => { if(done) return; done=true; clearTimeout(timer); cleanup(); reject(new Error('network error')); };
    script.src = url + sep + q + (q?'&':'') + 'callback=' + cbName;
    document.body.appendChild(script);
  });
}
async function ambilSoalServer(){
  const url = getSyncUrl(); if(!url) return null;
  try{ const res = await fetch(url+'?action=soal', {cache:'no-store'});
    if(res.ok){ const j = await res.json(); if(Array.isArray(j)) return j; if(j && Array.isArray(j.data)) return j.data; }
  }catch(e){}
  try{ const j = await jsonpGet(url, {action:'soal'}); if(Array.isArray(j)) return j; }catch(e){}
  return null;
}
async function pushSoalKeServer(list){
  const url = getSyncUrl(); if(!url) return {ok:false};
  if(soalSyncing) return {ok:false};
  soalSyncing = true;
  try{
    await fetch(url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'syncSoal', data:list})});
    soalSyncing = false;
    lastSheetCount = list.length;
    updateSyncBanner();
    return {ok:true};
  }catch(e){ soalSyncing=false; return {ok:false}; }
}
function updateSyncBanner(){
  const el = document.getElementById('soal-sync-note');
  if(!el) return;
  const local = getQuestions().length;
  if(!isSyncReady()){
    el.innerHTML = '<span class="pill warn">📴 Mode lokal · '+local+' soal · atur URL di Pengaturan</span>';
    return;
  }
  if(lastSheetCount === -1){
    el.innerHTML = '<span class="pill">📥 Sheet: belum ditarik · 💾 Lokal: '+local+' soal</span>';
    return;
  }
  if(lastSheetCount === local){
    el.innerHTML = '<span class="pill ok">✓ Sinkron · '+local+' soal · Sheet & lokal sama</span>';
  } else {
    el.innerHTML = '<span class="pill warn">⚠️ Sheet: '+lastSheetCount+' · Lokal: '+local+' · Berbeda — klik Tarik/Kirim</span>';
  }
}
async function silentPullFromSheet(){
  if(!isSyncReady()) return false;
  const list = await ambilSoalServer();
  if(!Array.isArray(list)) return false;
  lastSheetCount = list.length;
  if(list.length === 0) return false;
  const local = getQuestions();
  if(JSON.stringify(list) === JSON.stringify(local)) return false;
  store.set(KEY.Q, list);
  return true;
}
async function manualPullFromSheet(){
  if(!isSyncReady()){ alert('Atur URL Apps Script dulu di Pengaturan.'); return; }
  if(!confirm('⚠️ Tarik dari Sheet akan MENGGANTI bank soal lokal dengan isi Sheet saat ini.\n\nLanjutkan?')) return;
  const note = document.getElementById('soal-sync-note');
  if(note) note.innerHTML = '<span class="pill">📥 Memuat dari sheet...</span>';
  const list = await ambilSoalServer();
  if(!Array.isArray(list)){ if(note) note.innerHTML = '<span class="pill bad">✗ Gagal terhubung ke sheet</span>'; return; }
  if(list.length === 0){ alert('Sheet "Soal" masih kosong.'); if(note) updateSyncBanner(); return; }
  store.set(KEY.Q, list);
  lastSheetCount = list.length;
  render();
  alert('✓ Berhasil menarik '+list.length+' soal dari sheet.');
}
async function manualPushToSheet(){
  if(!isSyncReady()){ alert('Atur URL Apps Script dulu di Pengaturan.'); return; }
  const count = getQuestions().length;
  if(count === 0){ alert('Tidak ada soal untuk dikirim.'); return; }
  if(!confirm('⚠️ Kirim '+count+' soal ke Sheet akan MENGGANTI seluruh isi sheet "Soal".\n\nLanjutkan?')) return;
  const note = document.getElementById('soal-sync-note');
  if(note) note.innerHTML = '<span class="pill">📤 Mengirim ke sheet...</span>';
  const out = await pushSoalKeServer(getQuestions());
  if(out.ok){ alert('✓ Berhasil mengirim '+count+' soal ke sheet.'); }
  else { alert('✗ Gagal mengirim ke sheet.'); }
  updateSyncBanner();
}
function startPollingIfNeeded(){
  stopPolling();
  if(!session || session.role!=='admin' || adminTab!=='soal') return;
  if(!isSyncReady() || !getAutoPoll()) return;
  pollInterval = setInterval(async () => {
    if(document.hidden) return;
    if(!session || session.role!=='admin' || adminTab!=='soal'){ stopPolling(); return; }
    const changed = await silentPullFromSheet();
    if(changed){ renderSoalList(); updateSyncBanner(); }
    else updateSyncBanner();
  }, 90000);
}
function stopPolling(){ if(pollInterval){ clearInterval(pollInterval); pollInterval = null; } }

async function kirimHasilKeServer(r){
  const url = getSyncUrl(); if(!url) return {ok:false, reason:'no-url'};
  try{ await fetch(url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'simpan', data:r})}); return {ok:true}; }
  catch(e){ return {ok:false}; }
}
async function hapusHasilServer(id){
  const url = getSyncUrl(); if(!url) return;
  try{ await fetch(url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'hapus', id})}); }catch(e){}
}
async function hapusSemuaHasilServer(){
  const url = getSyncUrl(); if(!url) return;
  try{ await fetch(url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'hapusSemua'})}); }catch(e){}
}
async function ambilHasilServer(){
  const url = getSyncUrl(); if(!url) return null;
  try{ const res = await fetch(url+'?action=daftar', {cache:'no-store'});
    if(res.ok){ const j = await res.json(); if(Array.isArray(j)) return j; if(j && Array.isArray(j.data)) return j.data; }
  }catch(e){}
  try{ const j = await jsonpGet(url, {action:'daftar'}); if(Array.isArray(j)) return j; return []; }catch(e){ return null; }
}

function startQuiz(){
  const pool = getQuestionsForJenjang(session.jenjang);
  let items;
  if(pick.mode==='semua'){ items = filterByKategori(pool, pick.kategori); }
  else { items = pool.filter(q => pick.selected.indexOf(q.id)>=0); if(!items.length){ alert('Pilih minimal satu soal.'); return; } }
  if(!items.length){ alert('Belum ada soal.'); return; }
  items.sort((a,b) => a.kategori.localeCompare(b.kategori) || a.nomor-b.nomor);
  if(pick.acak) items = shuffle(items);
  quiz = { ids: items.map(q=>q.id), answers:{}, ragu:{}, idx:0, start: Date.now(), kategori: pick.kategori, acak: pick.acak };
  lastResult = null; render();
}
function startTimer(){
  clearInterval(timerInt);
  timerInt = setInterval(() => {
    const el = document.getElementById('timer');
    if(!el || !quiz){ clearInterval(timerInt); return; }
    el.textContent = fmtDur(Math.floor((Date.now()-quiz.start)/1000));
  }, 1000);
}
function palClass(id, idx){
  let cls = 'pal ';
  const doubt = quiz.ragu[id];
  const answered = quiz.answers[id] !== undefined;
  if(doubt) cls += 'doubt ';
  else if(answered) cls += 'done ';
  if(idx===quiz.idx) cls += 'cur';
  return cls.trim();
}

  const doubtful = Object.keys(quiz.ragu).filter(id=>quiz.ragu[id]).length;
  const opts = q.opsi.map((t,i)=>({t,i})).filter(o=>o.t && o.t.trim());
  const isDoubt = !!quiz.ragu[q.id];
  return topbar(q.kategori+' · Soal '+(quiz.idx+1)+'/'+total,
    '<span class="pill">⏱ <b id="timer">00:00</b></span>' +

      quiz.ids.map((id,i)=>'<button class="'+palClass(id,i)+'" onclick="gotoQ('+i+')">'+(i+1)+'</button>').join('') +
    '</div><div class="legend">' +
      '<b><i style="background:#dcfce7;border-color:#86efac"></i> Terjawab</b>' +

      '<b><i style="background:#f8fafc;border-color:#e2e8f0"></i> Belum dijawab</b>' +
    '</div></aside>' +
    '<main><div class="card">' +
      '<div class="row between wrap">'+katBadge(q.kategori)+' '+jenjangBadge(session.jenjang)+
        '<span class="muted small">Soal No. '+q.nomor+' · '+(quiz.idx+1)+' dari '+total+'</span></div>' +
      (isDoubt?'<div class="doubt-note">❓ Soal ini ditandai <b>ragu-ragu</b>.</div>':'') +
      '<h3 class="qtext">'+esc(q.pertanyaan)+'</h3><div>' +
      opts.map(o=>'<button class="opt '+(quiz.answers[q.id]===o.i?'sel':'')+'" onclick="pilihOpsi('+o.i+')">' +
        '<span class="ltr">'+LETTERS[o.i]+'</span><span>'+esc(o.t)+'</span></button>').join('') +
      '</div><div class="row gap wrap" style="margin-top:16px">' +
        '<button class="btn doubt '+(isDoubt?'active':'')+'" onclick="toggleRagu()">' +
          (isDoubt?'✓ Ragu-ragu (aktif)':'❓ Tandai Ragu-ragu')+'</button>' +
      '</div>' +
      '<div class="row between wrap" style="margin-top:18px;border-top:1px dashed var(--line);padding-top:16px">' +
        '<button class="btn ghost" onclick="navQ(-1)" '+(quiz.idx===0?'disabled':'')+'>← Sebelumnya</button>' +
        '<div class="row gap"><button class="btn ghost" onclick="finishQuiz()">Selesai & Nilai</button>' +
          '<button class="btn primary" onclick="'+(quiz.idx===total-1?'finishQuiz()':'navQ(1)')+'">' +
            (quiz.idx===total-1?'Selesai':'Selanjutnya →')+'</button></div></div>' +

}
function pilihOpsi(i){ quiz.answers[quiz.ids[quiz.idx]] = i; render(); }
function toggleRagu(){ const id = quiz.ids[quiz.idx]; quiz.ragu[id] = !quiz.ragu[id]; render(); }
function gotoQ(i){ quiz.idx = i; render(); }
function navQ(d){ const n = quiz.idx+d; if(n<0 || n>=quiz.ids.length) return; quiz.idx = n; render(); }

function finishQuiz(){
  const total = quiz.ids.length;
  const unanswered = quiz.ids.filter(id=>quiz.answers[id]===undefined).length;
  const doubtful = quiz.ids.filter(id=>quiz.ragu[id]).length;
  if(unanswered>0 || doubtful>0){
    let msg = '⚠️ KONFIRMASI SUBMIT UJIAN\n\n';
    if(unanswered>0) msg += '• '+unanswered+' soal BELUM DIJAWAB\n';
    if(doubtful>0) msg += '• '+doubtful+' soal DITANDAI RAGU-RAGU\n';
    msg += '\nSoal ragu dinilai berdasarkan jawaban saat ini.\n\nYakin menyelesaikan?';
    if(!confirm(msg)) return;
  }
  const all = getQuestions();
  let benar=0, salah=0, kosong=0;
  const detail = quiz.ids.map(id => {
    const q = all.find(x=>x.id===id) || {nomor:'?',kategori:'-',pertanyaan:'(dihapus)',opsi:[],jawaban:-1,pembahasan:''};
    const dipilih = quiz.answers[id];
    let status; if(dipilih===undefined) status='kosong'; else if(dipilih===q.jawaban) status='benar'; else status='salah';
    if(status==='benar') benar++; else if(status==='salah') salah++; else kosong++;
    return {id, nomor:q.nomor, kategori:q.kategori, pertanyaan:q.pertanyaan, opsi:q.opsi, jawaban:q.jawaban,
      dipilih:(dipilih===undefined?null:dipilih), status, ragu:!!quiz.ragu[id], pembahasan:q.pembahasan||''};
  });
  const nilai = Math.round(benar/total*100);
  const res = {id:uid(), username:session.username, nama:session.nama, jenjang:session.jenjang||'-',
    kategori:quiz.kategori, tanggal:new Date().toISOString(), total, benar, salah, kosong, nilai, detail,
    durasi:Math.round((Date.now()-quiz.start)/1000)};
  const rs = store.get(KEY.R, []); rs.unshift(res); store.set(KEY.R, rs);
  lastResult = Object.assign({}, res, {_fresh:true});
  quiz = null; clearInterval(timerInt); render(); window.scrollTo({top:0,behavior:'smooth'});
  kirimHasilKeServer(res).then(out=>{
    const el = document.getElementById('sync-note'); if(!el) return;

}

/* ---------- IMPORT CSV/JSON ---------- */
function importSoalFile(input){
  const f = input.files[0]; if(!f) return;
  const name = f.name.toLowerCase();
  const rd = new FileReader();
  rd.onload = function(){
    try{
      let list = [];
      if(name.endsWith('.json')){
        const data = JSON.parse(rd.result);
        const arr = Array.isArray(data) ? data : (data.questions||[]);
        list = arr.map(normalizeImportedQ);
      } else { list = parseCSVQuestions(rd.result); }
      list = list.filter(q => q && q.pertanyaan);
      if(!list.length){ alert('Tidak ada soal valid.'); input.value=''; return; }
      const existing = getQuestions();
      const counter = {}; existing.forEach(q => { counter[q.kategori] = Math.max(counter[q.kategori]||0, Number(q.nomor)||0); });
      list.forEach(q => { counter[q.kategori] = (counter[q.kategori]||0)+1; q.nomor = counter[q.kategori]; q.id = uid(); existing.push(q); });
      setQuestions(existing); input.value = ''; render();
      alert(list.length+' soal ditambahkan. Total: '+existing.length+' soal.');
    }catch(e){ alert('File tidak valid: '+e.message); }
  };
  rd.readAsText(f, 'UTF-8');
}
function normalizeImportedQ(raw){
  if(!raw || !raw.pertanyaan) return null;
  let opsi = Array.isArray(raw.opsi) ? raw.opsi.slice(0,5) : [];
  while(opsi.length<5) opsi.push('');
  let jaw = raw.jawaban;
  if(typeof jaw==='string'){ const t=jaw.trim().toUpperCase(); const idx=LETTERS.indexOf(t); jaw=idx>=0?idx:(Number(t)-1); }
  if(typeof jaw!=='number' || isNaN(jaw) || jaw<0 || jaw>4) jaw = 0;
  let jenjang = String(raw.jenjang || '').trim();
  if(!jenjang) jenjang = 'Semua';
  return {kategori:(raw.kategori||'Teknis').trim(), jenjang, nomor:Number(raw.nomor)||1, pertanyaan:String(raw.pertanyaan).trim(),
    opsi:opsi.map(s=>String(s||'').trim()), jawaban:jaw, pembahasan:String(raw.pembahasan||'').trim()};
}
function parseCSVQuestions(text){
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(l=>l.trim());
  if(!lines.length) return [];
  const first = lines[0];
  const delim = (first.split(';').length >= first.split(',').length) ? ';' : ',';
  const rows = lines.map(line=>parseCSVLine(line, delim));
  const head = rows.shift().map(h=>h.trim().toLowerCase());
  const find = function(){ for(let i=0;i<arguments.length;i++){ const idx=head.indexOf(arguments[i]); if(idx>=0) return idx; } return -1; };
  const iKat=find('kategori','category'), iJen=find('jenjang','level'), iNom=find('nomor','no','number'), iQ=find('pertanyaan','question','soal');
  const iA=find('opsi_a','opsia','a','pilihan_a'), iB=find('opsi_b','opsib','b','pilihan_b');
  const iC=find('opsi_c','opsic','c','pilihan_c'), iD=find('opsi_d','opsid','d','pilihan_d'), iE=find('opsi_e','opsie','e','pilihan_e');
  const iJ=find('jawaban','kunci','answer','key'), iP=find('pembahasan','penjelasan','explanation');
  if(iQ<0) throw new Error('Kolom "pertanyaan" tidak ada di header CSV.');
  return rows.map(r=>{
    const get = i=>i>=0?(r[i]||'').trim():'';
    return normalizeImportedQ({kategori:get(iKat), jenjang:get(iJen), nomor:get(iNom), pertanyaan:get(iQ),
      opsi:[get(iA),get(iB),get(iC),get(iD),get(iE)], jawaban:get(iJ), pembahasan:get(iP)});
  }).filter(q=>q && q.pertanyaan);
}
function parseCSVLine(line, delim){
  const out = []; let cur='', inQ=false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQ){ if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; } else cur+=ch; }
    else { if(ch==='"') inQ=true; else if(ch===delim){ out.push(cur); cur=''; } else cur+=ch; }
  }
  out.push(cur); return out;
}
function downloadSoalTemplate(){
  const head = ['kategori','jenjang','nomor','pertanyaan','opsi_a','opsi_b','opsi_c','opsi_d','opsi_e','jawaban','pembahasan'];
  const ex1 = ['Teknis','Semua','1','Apa kepanjangan TFR?','Total Fertility Rate','Tingkat Fertilitas Rendah','Total Fertilitas Rata-rata','Total Fekunditas Rate','Tingkat Fekunditas Rata-rata','A','TFR = Total Fertility Rate.'];
  const ex2 = ['Manajerial','Penyuluh KB Penyelia, Penyuluh KB Ahli Pertama','1','Fungsi POAC...','Planning','Organizing','Actuating','Controlling','Evaluasi','A','POAC.'];
  const csv = '\uFEFF' + [head, ex1, ex2].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'template-soal.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}

async function loadWordFile(input){
  const f = input.files[0]; if(!f) return;
  const status = document.getElementById('wi-status');
  if(status) status.innerHTML = '<span class="pill">Membaca file...</span>';
  const name = f.name.toLowerCase();
  try{
    let text;
    if(name.endsWith('.docx')){
      if(typeof mammoth==='undefined') throw new Error('Library mammoth belum termuat.');
      const ab = await f.arrayBuffer();
      const res = await mammoth.extractRawText({arrayBuffer: ab});
      text = res.value;
    } else { text = await f.text(); }
    document.getElementById('wi-text').value = text;
    if(status) status.innerHTML = '<span class="pill ok">File terbaca ('+text.length+' karakter).</span>';
  }catch(e){ if(status) status.innerHTML = '<span class="pill bad">Gagal: '+esc(e.message)+'</span>'; }
  input.value = '';
}
function previewWordParse(){
  const raw = document.getElementById('wi-text').value;
  const kat = document.getElementById('wi-kat').value.trim() || 'Teknis';
  const jenjang = document.getElementById('wi-jenjang').value.trim() || 'Semua';
  const status = document.getElementById('wi-status'), preview = document.getElementById('wi-preview');
  if(!raw.trim()){ alert('Teks kosong.'); return; }
  let parsed;
  try{ parsed = parseSoalText(raw, kat, jenjang); }catch(e){ if(status) status.innerHTML = '<span class="pill bad">Error: '+esc(e.message)+'</span>'; return; }
  if(!parsed.length){ if(status) status.innerHTML = '<span class="pill bad">Tidak ada soal terdeteksi.</span>'; if(preview) preview.innerHTML = ''; return; }
  if(status) status.innerHTML = '<span class="pill ok">Terdeteksi '+parsed.length+' soal.</span>';
  if(preview) preview.innerHTML = parsed.map((q,i) =>
    '<div class="preview-item"><span class="preview-badge">'+esc(q.kategori)+' · '+esc(shortJenjang(q.jenjang))+' · Soal '+(i+1)+'</span>' +
    '<div class="q">'+esc(q.pertanyaan)+'</div>' +
    q.opsi.map((t,j)=>(t&&t.trim())?'<div class="o '+(j===q.jawaban?'key':'')+'">'+LETTERS[j]+'. '+esc(t)+(j===q.jawaban?' (kunci)':'')+'</div>':'').join('') +
    '</div>').join('');

function prosesImportWord(){
  const raw = document.getElementById('wi-text').value;
  const kat = document.getElementById('wi-kat').value.trim() || 'Teknis';
  const jenjang = document.getElementById('wi-jenjang').value.trim() || 'Semua';
  const status = document.getElementById('wi-status');
  if(!raw.trim()){ alert('Teks kosong.'); return; }
  let parsed;
  try{ parsed = parseSoalText(raw, kat, jenjang); }catch(e){ if(status) status.innerHTML = '<span class="pill bad">Error: '+esc(e.message)+'</span>'; return; }
  if(!parsed.length){ if(status) status.innerHTML = '<span class="pill bad">Tidak ada soal.</span>'; return; }
  if(!confirm('Tambah '+parsed.length+' soal?')) return;
  const existing = getQuestions();
  const counter = {}; existing.forEach(q => { counter[q.kategori] = Math.max(counter[q.kategori]||0, Number(q.nomor)||0); });
  parsed.forEach(q => { counter[q.kategori] = (counter[q.kategori]||0)+1; q.nomor = counter[q.kategori]; q.id = uid(); existing.push(q); });
  setQuestions(existing); closeModal(); render();
  alert('✓ '+parsed.length+' soal ditambahkan. Total: '+existing.length+' soal.');
}
function parseSoalText(text, defaultKat, defaultJenjang){
  text = String(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/\f/g,'\n').replace(/\u00A0/g,' ');
  const lines = text.split('\n'), questions = [];
  let cur=null, mode=null, kategori=defaultKat||'Teknis', jenjang=defaultJenjang||'Semua';
  const reKat = /^\s*(?:kategori|category)\s*[:\-]\s*(.+)$/i;
  const reJen = /^\s*jenjang\s*[:\-]\s*(.+)$/i;
  const reQ = /^\s*(\d+)\s*[\.\)]\s*(.+)$/;
  const reOpt = /^\s*([A-Ea-e])\s*[\.\)]\s*(.+)$/;
  const reAns = /^\s*(?:jawaban|kunci|answer|key)\s*[:\-]?\s*([A-Ea-e]|\d)\b/i;
  const reBahas = /^\s*(?:pembahasan|penjelasan|bahas|explanation)\s*[:\-]\s*(.*)$/i;
  function flush(){
    if(cur && cur.pertanyaan && cur.pertanyaan.trim()){
      while(cur.opsi.length<5) cur.opsi.push('');
      if(cur.jawaban==null) cur.jawaban = 0;
      if(cur.jawaban<0 || cur.jawaban>4) cur.jawaban = 0;
      if(!cur.opsi[cur.jawaban] || !cur.opsi[cur.jawaban].trim()){
        for(let k=0;k<5;k++){ if(cur.opsi[k] && cur.opsi[k].trim()){ cur.jawaban = k; break; } }
      }
      questions.push(cur);
    }
    cur = null; mode = null;
  }
  for(let i=0;i<lines.length;i++){
    const ln = lines[i].replace(/\s+$/,'').replace(/^\s+/,'');
    if(!ln) continue;
    const mKat = ln.match(reKat);
    if(mKat){
      let k = mKat[1].trim();
      if(/sosio/i.test(k)) kategori = 'Sosiokultural';
      else if(/^teknis$/i.test(k)) kategori = 'Teknis';
      else kategori = k;
      continue;
    }
    const mJen = ln.match(reJen);
    if(mJen){ jenjang = mJen[1].trim() || 'Semua'; continue; }
    const mQ = ln.match(reQ);
    if(mQ){ flush(); cur = {kategori, jenjang, pertanyaan:mQ[2].trim(), opsi:[], jawaban:null, pembahasan:''}; mode='q'; continue; }
    const mOpt = ln.match(reOpt);
    if(mOpt && cur && mode!=='bahas'){
      const idx = LETTERS.indexOf(mOpt[1].toUpperCase());
      if(idx>=0){ cur.opsi[idx] = mOpt[2].trim(); mode='opt'; continue; }
    }
    const mAns = ln.match(reAns);
    if(mAns && cur){
      const v = mAns[1].toUpperCase();
      const idx = LETTERS.indexOf(v);
      cur.jawaban = idx>=0 ? idx : Math.max(0, Math.min(4, Number(v)-1));
      mode = 'ans'; continue;
    }
    const mBah = ln.match(reBahas);
    if(mBah && cur){ cur.pembahasan = mBah[1].trim(); mode='bahas'; continue; }
    if(cur){
      if(mode==='q') cur.pertanyaan += ' '+ln.trim();
      else if(mode==='bahas') cur.pembahasan += ' '+ln.trim();
      else if(mode==='opt'){ for(let j=4;j>=0;j--){ if(cur.opsi[j]){ cur.opsi[j] += ' '+ln.trim(); break; } } }
    }
  }
  flush();
  return questions.map(q=>({kategori:q.kategori, jenjang:q.jenjang, nomor:1, pertanyaan:q.pertanyaan, opsi:q.opsi.slice(0,5), jawaban:q.jawaban, pembahasan:q.pembahasan}));
}

function exportCSV(){
  const rs = currentResultsList.length ? currentResultsList : store.get(KEY.R, []);
  if(!rs.length){ alert('Belum ada data.'); return; }
  const head = ['Nama','Username','Jenjang','Kategori','Tanggal','Jumlah Soal','Benar','Salah','Kosong','Nilai','Durasi'];
  const rows = rs.map(r=>[r.nama, r.username, r.jenjang||'-', r.kategori, fmtDate(r.tanggal), r.total, r.benar, r.salah, r.kosong, r.nilai, r.durasi||0]);
  const csv = '\uFEFF' + [head].concat(rows).map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'hasil-ujian-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}
function importHasil(input){
  const f = input.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      let data = JSON.parse(rd.result); if(!Array.isArray(data)) data = [data];
      const cur = store.get(KEY.R, []); const ids = new Set(cur.map(r=>r.id)); let added = 0;
      data.forEach(r => { if(r && r.id && r.detail && !ids.has(r.id)){ cur.push(r); ids.add(r.id); added++; } });
      store.set(KEY.R, cur); render(); alert(added+' hasil diimpor.');
    }catch(e){ alert('File tidak valid: '+e.message); }
  };
  rd.readAsText(f); input.value = '';
}

const APPS_SCRIPT_CODE = `const SHEET='Hasil';
const SHEET_SOAL='Soal';
const HEADERS=['id','username','nama','kategori','tanggal','total','benar','salah','kosong','nilai','durasi','detail'];
const HEADERS_SOAL=['id','kategori','jenjang','nomor','pertanyaan','opsi_a','opsi_b','opsi_c','opsi_d','opsi_e','jawaban','pembahasan'];
const L=['A','B','C','D','E'];

function doPost(e){
  try{
    const b=JSON.parse(e.postData.contents);
    const a=b.action;
    if(a==='simpan'){
      const sh=getSheet(SHEET,HEADERS),d=b.data;
      sh.appendRow([d.id,d.username,d.nama,d.kategori,d.tanggal,d.total,d.benar,d.salah,d.kosong,d.nilai,d.durasi||0,JSON.stringify(d.detail||[])]);
      return out({ok:true});
    }
    if(a==='hapus'){
      const sh=getSheet(SHEET,HEADERS),v=sh.getDataRange().getValues();
      for(let i=v.length-1;i>=1;i--){if(String(v[i][0])===String(b.id))sh.deleteRow(i+1);}
      return out({ok:true});
    }
    if(a==='hapusSemua'){
      const sh=getSheet(SHEET,HEADERS);
      if(sh.getLastRow()>1)sh.deleteRows(2,sh.getLastRow()-1);
      return out({ok:true});
    }
    if(a==='syncSoal'){
      const sh=getSheet(SHEET_SOAL,HEADERS_SOAL);
      sh.clear();
      sh.appendRow(HEADERS_SOAL);
      const arr=b.data||[];
      if(arr.length){
        const rows=arr.map(q=>[q.id,q.kategori,q.jenjang||'Semua',q.nomor,q.pertanyaan,q.opsi[0]||'',q.opsi[1]||'',q.opsi[2]||'',q.opsi[3]||'',q.opsi[4]||'',L[q.jawaban]||'A',q.pembahasan||'']);
        sh.getRange(2,1,rows.length,HEADERS_SOAL.length).setValues(rows);
      }
      return out({ok:true,count:arr.length});
    }
    return out({ok:false,error:'aksi tidak dikenal: '+a});
  }catch(err){return out({ok:false,error:String(err)});}
}

function doGet(e){
  const a=(e&&e.parameter&&e.parameter.action)||'';
  const cb=e&&e.parameter&&e.parameter.callback;
  if(a==='ping')return out({ok:true,status:'ok',versi:3,waktu:new Date().toISOString()},cb);
  if(a==='daftar'){
    const sh=getSheet(SHEET,HEADERS);
    if(sh.getLastRow()<2)return out([],cb);
    const v=sh.getDataRange().getValues(),h=v.shift();
    const rows=v.map(r=>{const o={};h.forEach((x,i)=>o[x]=r[i]);try{o.detail=JSON.parse(o.detail||'[]');}catch(_){o.detail=[];}return o;});
    return out(rows.reverse(),cb);
  }
  if(a==='soal'){
    const sh=getSheet(SHEET_SOAL,HEADERS_SOAL);
    if(sh.getLastRow()<2)return out([],cb);
    const v=sh.getDataRange().getValues(),h=v.shift();
    const rows=v.map(r=>{const o={};h.forEach((x,i)=>o[x]=r[i]);
      return{id:String(o.id||''),kategori:String(o.kategori||'Teknis'),jenjang:String(o.jenjang||'Semua'),nomor:Number(o.nomor)||1,pertanyaan:String(o.pertanyaan||''),opsi:[o.opsi_a||'',o.opsi_b||'',o.opsi_c||'',o.opsi_d||'',o.opsi_e||''],jawaban:Math.max(0,L.indexOf(String(o.jawaban||'A').toUpperCase())),pembahasan:String(o.pembahasan||'')};
    });
    return out(rows,cb);
  }
  return out({ok:true,pesan:'Actions: ping, daftar, soal'},cb);
}

function getSheet(name,headers){
  const ss=SpreadsheetApp.getActiveSpreadsheet();
  let sh=ss.getSheetByName(name);
  if(!sh){sh=ss.insertSheet(name);sh.appendRow(headers);}
  return sh;
}
function out(o,cb){
  const j=JSON.stringify(o);
  if(cb&&/^[a-zA-Z0-9_$.]+$/.test(cb)){return ContentService.createTextOutput(cb+'('+j+')').setMimeType(ContentService.MimeType.JAVASCRIPT);}
  return ContentService.createTextOutput(j).setMimeType(ContentService.MimeType.JSON);
}

function toggleAutoPoll(enabled){
  const st = store.get(KEY.S, {}); st.autoPoll = enabled; store.set(KEY.S, st);
  if(enabled && adminTab==='soal') startPollingIfNeeded();
  else stopPolling();
  render();
}
function simpanSyncUrl(){
  const v = document.getElementById('sync-url').value.trim();
  if(v && !/^https?:\/\/.+\/exec$/.test(v)){ if(!confirm('URL tidak berakhiran /exec. Tetap?')) return; }
  const st = store.get(KEY.S, {}); st.syncUrl = v; store.set(KEY.S, st); testSync();
}
async function testSync(){
  const box = document.getElementById('sync-test'); if(!box) return;
  box.innerHTML = '<span class="pill">Menguji...</span>';
  const url = getSyncUrl();
  if(!url){ box.innerHTML = '<span class="pill bad">URL belum diisi.</span>'; return; }
  try{ const r = await fetch(url+'?action=ping', {cache:'no-store'}); const j = await r.json();
    if(j && j.ok){ box.innerHTML = '<span class="pill ok">Backend terhubung (versi '+(j.versi||'?')+').</span>'; return; }
  }catch(e){}
  try{ const j = await jsonpGet(url, {action:'ping'});
    if(j && j.ok){ box.innerHTML = '<span class="pill ok">Backend terhubung (JSONP, versi '+(j.versi||'?')+').</span>'; return; }
  }catch(e){}
  box.innerHTML = '<span class="pill bad">Gagal terhubung.</span>';
}
function copyAppsScript(btn){
  const text = APPS_SCRIPT_CODE;
  const done = () => { const old = btn.textContent; btn.textContent = 'Tersalin!'; setTimeout(()=>btn.textContent=old, 1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>{fallbackCopy(text);done();}); }
  else { fallbackCopy(text); done(); }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta);
}
function gantiPass(){
  const v = document.getElementById('new-pass').value.trim();
  if(v.length<5){ alert('Minimal 5 karakter.'); return; }
  const st = store.get(KEY.S, {adminPassword:'admin123'}); st.adminPassword = v; store.set(KEY.S, st);
  alert('Password diubah.'); render();
}
function exportAll(){
  const data = {app:'Latihan Soal Penyuluh KB', versi:6, diekspor:new Date().toISOString(),
    questions:getQuestions(), results:store.get(KEY.R, []), users:store.get(KEY.U, []),
    settings:store.get(KEY.S, {adminPassword:'admin123'})};
  downloadJSON(data, 'backup-latihan-kb-'+new Date().toISOString().slice(0,10)+'.json');
}
function importAll(input){
  const f = input.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      if(d.questions) setQuestions(d.questions);
      if(d.results) store.set(KEY.R, d.results);
      if(d.users) store.set(KEY.U, d.users);
      if(d.settings) store.set(KEY.S, d.settings);
      render(); alert('Data diimpor.');
    }catch(e){ alert('File tidak valid: '+e.message); }
  };
  rd.readAsText(f); input.value = '';
}
function resetSoal(){
  if(!confirm('Kembalikan seluruh soal ke bank bawaan (55 soal)?')) return;
  setQuestions(bootstrapQuestions()); render(); alert('Soal direset ke bank bawaan.');
}
